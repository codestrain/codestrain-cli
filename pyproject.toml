[project]
name = "codestrain"
version = "0.1.4"
description = "Your AI coding recovery score, from the terminal."
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ivan Kononov" }]
keywords = ["claude-code", "developer-tools", "wellness", "drs", "burnout"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
# stdlib only — that's the whole point of this CLI.
dependencies = []

[project.scripts]
codestrain = "codestrain_cli:main"

[project.urls]
Homepage = "https://codestrain.dev"
Repository = "https://github.com/codestrain/codestrain-cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["codestrain_cli.py"]
sources = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Block site-installed plugins (pytest-recording / vcr break in modern urllib3).
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
